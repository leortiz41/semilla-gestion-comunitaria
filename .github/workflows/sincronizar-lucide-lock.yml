name: Sincronizar lock Lucide
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sincronizar-lucide-lock.yml'
permissions:
  contents: write
jobs:
  actualizar-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama develop
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualizar lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirmar dependencia instalada
        shell: bash
        run: |
          node -e "const p=require('./frontend/package-lock.json'); if(!p.packages['node_modules/lucide-react']) process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(frontend): bloquear version de Lucide React'
            git push origin HEAD:develop
          fi
