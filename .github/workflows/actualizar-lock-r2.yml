name: Sincronizar lock de dependencias R2
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/actualizar-lock-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar package-lock de backend
        working-directory: backend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Guardar lock sincronizado
        run: |
          if ! git diff --quiet -- backend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json
            git commit -m "build(r2): sincronizar package-lock con SDK oficial"
            git push origin HEAD:develop
          fi
